name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  pull_request:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      finalize_local_publish:
        description: Finalize an npm version published locally
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ (github.event_name == 'push' || inputs.finalize_local_publish) && 'main' || github.run_id }}
  queue: max

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '26.3.1'
  NPM_VERSION: '11.21.3'

jobs:
  version:
    name: Check release version
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.repository == 'kelvicthrust/paseo-task-inbox' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Check release version
        id: version
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          FINALIZE_LOCAL: ${{ inputs.finalize_local_publish }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            previous=$(git show "$BEFORE:package.json" | jq -er '.version')
            version=$(node scripts/check-release-version.ts "$previous")
            if [[ -z "$version" ]]; then
              echo "Package version did not change."
              exit 0
            fi
          elif [[ "$FINALIZE_LOCAL" == true ]]; then
            version=$(node scripts/check-release-version.ts --finalize)
          else
            version=$(node scripts/check-release-version.ts)
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="refs/tags/v$version"
            if git show-ref --verify --quiet "$tag" &&
              [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "Tag v$version already points to another commit." >&2
              exit 1
            fi
          elif [[ "$FINALIZE_LOCAL" == true ]]; then
            if [[ "$GITHUB_REPOSITORY" != kelvicthrust/paseo-task-inbox ]] ||
               [[ "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != "refs/tags/v$version" ]] ||
               ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "Finalize from the source repository's main branch or its matching release tag." >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check queued release labels
        if: github.event_name == 'push' && steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/prepare-label-release.ts --check "$GITHUB_SHA" "$VERSION"

  build:
    name: Build and test release package
    needs: version
    if: github.event_name != 'pull_request' && needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          npm ci --ignore-scripts
      - name: Verify source
        run: |
          npm run typecheck
          npm test
      - name: Pack and verify the release archive
        run: |
          npm run pack:release
          npm run test:package
      - name: Gather release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
          FINALIZE_LOCAL: ${{ inputs.finalize_local_publish }}
        working-directory: dist/release
        run: |
          assets=("kelvicthrust-paseo-task-inbox-$VERSION.tgz")
          if [[ "$GITHUB_EVENT_NAME" == push || "$FINALIZE_LOCAL" == true ]]; then
            notes="v$VERSION.md"
            cp "../../docs/releases/$notes" "$notes"
            assets+=("$notes")
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
      - name: Upload verified release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paseo-task-inbox-${{ needs.version.outputs.version }}-${{ github.run_attempt }}
          path: |
            dist/release/kelvicthrust-paseo-task-inbox-${{ needs.version.outputs.version }}.tgz
            dist/release/v${{ needs.version.outputs.version }}.md
            dist/release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  npm:
    name: Publish and verify npm package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'kelvicthrust/paseo-task-inbox'
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install --global --ignore-scripts "npm@$NPM_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/release
      - name: Verify checksum and publish to npm
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist/release && cmp SHA256SUMS <(sha256sum "kelvicthrust-paseo-task-inbox-$VERSION.tgz" "v$VERSION.md"))
          node scripts/publish-release-npm.ts "$VERSION" dist/release

  verify_local:
    name: Verify locally published npm package
    if: github.event_name == 'workflow_dispatch' && inputs.finalize_local_publish
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/release
      - name: Verify checksum and public npm download
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist/release && cmp SHA256SUMS <(sha256sum "kelvicthrust-paseo-task-inbox-$VERSION.tgz" "v$VERSION.md"))
          node scripts/publish-release-npm.ts "$VERSION" dist/release --verify-only

  github:
    name: Publish GitHub release
    if: >-
      !cancelled() && github.repository == 'kelvicthrust/paseo-task-inbox' &&
      needs.version.result == 'success' && needs.build.result == 'success' &&
      (needs.npm.result == 'success' || needs.verify_local.result == 'success')
    needs: [version, build, npm, verify_local]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GIT_TERMINAL_PROMPT: '0'
          VERSION: ${{ needs.version.outputs.version }}
          BUILT_COMMIT: ${{ github.sha }}
        working-directory: release
        run: |
          archive="kelvicthrust-paseo-task-inbox-$VERSION.tgz"
          notes="v$VERSION.md"
          cmp SHA256SUMS <(sha256sum "$archive" "$notes")
          tag="v$VERSION"
          ref="refs/tags/$tag"

          tag_commit() {
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              ls-remote "$GITHUB_SERVER_URL/$GH_REPO.git" "$ref" "$ref^{}" |
              awk -v ref="$ref" '$2 == ref { tip=$1 } $2 == ref "^{}" { peeled=$1 } END { print (peeled == "" ? tip : peeled) }'
          }
          tip=$(tag_commit)
          if [[ -z "$tip" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="$ref" -f sha="$BUILT_COMMIT" --silent
            tip=$(tag_commit)
          fi
          if [[ "$tip" != "$BUILT_COMMIT" ]]; then
            echo "Tag $tag does not point to the built commit." >&2
            exit 1
          fi

          release_by_tag() {
            gh api "repos/$GH_REPO/releases" --paginate --slurp |
              jq -c --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] |
                if length > 1 then error("Multiple releases for " + $tag) else .[] end'
          }
          release=$(release_by_tag)
          if [[ -z "$release" ]]; then
            # The release list can lag behind draft creation. Use the response's ID.
            release=$(gh api --method POST "repos/$GH_REPO/releases" \
              -f tag_name="$tag" -f target_commitish="$BUILT_COMMIT" \
              -f name="Paseo Task Inbox $tag" -F draft=true)
          fi
          id=$(jq -er --arg tag "$tag" 'select(.tag_name == $tag and .prerelease == false) | .id | numbers' <<< "$release")
          draft=$(jq -r '.draft' <<< "$release")
          expected=$(sha256sum "$archive" "$notes" SHA256SUMS |
            jq -Rcs 'split("\n") | map(select(length > 0) | split("  ") |
              {name: .[1], digest: ("sha256:" + .[0]), state: "uploaded"}) | sort_by(.name)')
          release_assets() {
            gh api "repos/$GH_REPO/releases/$id/assets" --paginate --slurp |
              jq -c '[.[][] | {name, digest, state}] | sort_by(.name)'
          }
          assets=$(release_assets)
          if ! jq -e --argjson expected "$expected" '. - $expected == []' <<< "$assets" > /dev/null; then
            echo "Existing release assets differ from the build." >&2
            exit 1
          fi
          missing=$(jq -r --argjson expected "$expected" '($expected - .)[].name' <<< "$assets")
          if [[ -n "$missing" ]]; then
            if [[ "$draft" != true ]]; then
              echo "The published release is missing verified assets." >&2
              exit 1
            fi
            while IFS= read -r asset; do
              gh api --method POST "https://uploads.github.com/repos/$GH_REPO/releases/$id/assets?name=$asset" \
                -H 'Content-Type: application/octet-stream' --input "$asset" --silent
            done <<< "$missing"
          fi

          if [[ "$draft" == true ]]; then
            assets=$(release_assets)
            tip=$(tag_commit)
            if [[ "$assets" != "$expected" || "$tip" != "$BUILT_COMMIT" ]]; then
              echo "The draft release tag or assets differ from the build." >&2
              exit 1
            fi
            gh api --method PATCH "repos/$GH_REPO/releases/$id" \
              -F "body=@$notes" -F draft=false -f make_latest=legacy --jq '.html_url'
          else
            jq -r '.html_url' <<< "$release"
          fi
